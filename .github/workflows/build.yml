name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Public source and history privacy guard
        run: python3 scripts/check-public-privacy.py
      - name: Protocol tests with sanitizers
        run: bash scripts/test.sh
      - name: Feature catalogue validation
        run: python3 tests/FeatureCatalogTests.py
      - name: Security regression tests
        run: bash scripts/security-test.sh
      - name: Public source export regression tests
        run: python3 tests/SourceExportTests.py
      - name: Export source without Sony imagery
        run: OPENSOUND_DEVICE_IMAGES=none bash scripts/package-source.sh
      - name: Build Apple Silicon app
        run: bash scripts/build.sh
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/OpenSound.app dist/OpenSound-macos-arm64.zip
      - name: Build and verify drag-to-Applications installer
        run: bash scripts/package-dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenSound-macos-arm64
          path: |
            dist/OpenSound-macos-arm64.zip
            dist/OpenSound-*-macos-arm64.dmg
            dist/OpenSound-*-macos-arm64.dmg.sha256
