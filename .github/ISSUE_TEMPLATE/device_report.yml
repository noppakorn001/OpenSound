name: Device compatibility report
description: Share evidence for another Sony headphone model
body:
  - type: input
    id: model
    attributes:
      label: Model and firmware
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and OpenSound version
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: Controls tested and device readback
      description: Distinguish reads, confirmed writes, failed writes and restored values. A Bluetooth ACK alone is insufficient.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Missing controls or unavailable formats
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no Bluetooth addresses, account information or unredacted pairing history.
          required: true
