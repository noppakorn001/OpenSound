name: Bug report
description: Report a reproducible OpenSound problem
body:
  - type: input
    id: version
    attributes:
      label: OpenSound version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, headphone model and firmware
      placeholder: macOS / model / firmware
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized evidence
      description: Do not upload the IPA, account secrets, Bluetooth addresses, pairing history, or unredacted captures.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information and device addresses.
          required: true
